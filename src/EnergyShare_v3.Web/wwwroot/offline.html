<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EnergyShare - Hors connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #F4F1EA;
            color: #2C3E50;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            max-width: 520px;
            background: white;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            text-decoration: none;
            background: #FFD700;
            color: #2C3E50;
            padding: .8rem 1.2rem;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vous êtes hors connexion</h1>
        <p>
            Certaines fonctionnalités d’EnergyShare nécessitent une connexion au serveur.
            Vous pouvez réessayer dès que le réseau revient.
        </p>
        <a href="/">Réessayer</a>
    </div>
</body>
</html>
